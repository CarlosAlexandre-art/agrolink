<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 160">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#104e27"/>
      <stop offset="100%" style="stop-color:#679d3f"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#679d3f"/>
      <stop offset="100%" style="stop-color:#8dc63f"/>
    </linearGradient>
  </defs>

  <!-- Ícone (versão compacta) -->
  <!-- Circle outline -->
  <circle cx="80" cy="80" r="62" fill="none" stroke="url(#g1)" stroke-width="5.5"/>

  <!-- Leaf -->
  <path d="M39 106 C39 62 60 40 80 40 C72 54 62 71 62 91 C62 103 54 112 39 112 Z" fill="url(#g1)"/>
  <path d="M80 40 C72 55 64 76 61 99" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>

  <!-- Bars -->
  <rect x="80" y="90" width="9" height="20" rx="2" fill="url(#g1)" opacity="0.9"/>
  <rect x="92" y="80" width="9" height="30" rx="2" fill="url(#g1)"/>
  <rect x="104" y="69" width="9" height="41" rx="2" fill="url(#g2)"/>

  <!-- Arrow -->
  <path d="M109 66 L109 58 M105 62 L109 56 L113 62" fill="none" stroke="#679d3f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- R$ -->
  <text x="83" y="68" font-family="Arial" font-weight="900" font-size="11" fill="#104e27">R$</text>

  <!-- Horizon -->
  <path d="M34 124 Q80 118 126 124" fill="none" stroke="#679d3f" stroke-width="1.6" stroke-linecap="round" opacity="0.5"/>
  <path d="M40 131 Q80 126 120 131" fill="none" stroke="#679d3f" stroke-width="1.2" stroke-linecap="round" opacity="0.35"/>

  <!-- Wordmark: AgroCore -->
  <text x="170" y="73" font-family="Arial, sans-serif" font-weight="900" font-size="56" fill="#104e27" letter-spacing="-2">AgroCore</text>

  <!-- Tagline -->
  <text x="172" y="105" font-family="Arial, sans-serif" font-weight="600" font-size="14" fill="#679d3f" letter-spacing="3">SOLUÇÕES SUSTENTÁVEIS DO CAMPO</text>
</svg>
