<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Arial, sans-serif">

  <!-- Fundo creme -->
  <rect width="900" height="500" fill="#dad6ca"/>

  <!-- Label topo -->
  <text x="50" y="50" font-size="11" font-weight="700" fill="#104e27" letter-spacing="4" opacity="0.5">TIPOGRAFIA — AGROCORE BRAND</text>

  <!-- Divider -->
  <line x1="50" y1="62" x2="850" y2="62" stroke="#104e27" stroke-width="1" opacity="0.15"/>

  <!-- Display -->
  <text x="50" y="80" font-size="10" font-weight="700" fill="#679d3f" letter-spacing="3" opacity="0.7">DISPLAY / HEADLINE — PESO 900</text>
  <text x="50" y="150" font-size="78" font-weight="900" fill="#104e27" letter-spacing="-3">AgroCore</text>

  <!-- Divider -->
  <line x1="50" y1="170" x2="850" y2="170" stroke="#104e27" stroke-width="1" opacity="0.12"/>

  <!-- Subtítulo -->
  <text x="50" y="192" font-size="10" font-weight="700" fill="#679d3f" letter-spacing="3" opacity="0.7">TÍTULO — PESO 700</text>
  <text x="50" y="240" font-size="36" font-weight="700" fill="#104e27">Soluções Sustentáveis do Campo</text>

  <!-- Divider -->
  <line x1="50" y1="258" x2="850" y2="258" stroke="#104e27" stroke-width="1" opacity="0.12"/>

  <!-- Corpo -->
  <text x="50" y="278" font-size="10" font-weight="700" fill="#679d3f" letter-spacing="3" opacity="0.7">CORPO — PESO 400</text>
  <text x="50" y="320" font-size="18" fill="#4a5568">Conectamos produtores rurais a prestadores de serviço com tecnologia,</text>
  <text x="50" y="344" font-size="18" fill="#4a5568">segurança e rastreabilidade em tempo real em todo o Brasil.</text>

  <!-- Divider -->
  <line x1="50" y1="365" x2="850" y2="365" stroke="#104e27" stroke-width="1" opacity="0.12"/>

  <!-- Caption -->
  <text x="50" y="385" font-size="10" font-weight="700" fill="#679d3f" letter-spacing="3" opacity="0.7">LABEL / BADGE — PESO 600</text>
  <text x="50" y="430" font-size="13" font-weight="600" fill="#679d3f" letter-spacing="4">SERVIÇOS RURAIS · MARKETPLACE · BRASIL</text>

  <!-- Font name watermark -->
  <text x="840" y="490" font-size="10" fill="#104e27" opacity="0.3" text-anchor="end">Montserrat (Google Fonts)</text>

</svg>
