<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#166534"/>
      <stop offset="100%" style="stop-color:#15803d"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#16a34a;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Fundo circular com gradiente -->
  <circle cx="50" cy="50" r="48" fill="url(#bg)"/>
  <!-- Anel externo sutil -->
  <circle cx="50" cy="50" r="46" fill="none" stroke="#22c55e" stroke-width="0.8" opacity="0.4"/>

  <!-- Cabeça estilizada -->
  <rect x="28" y="22" width="44" height="36" rx="14" fill="#dcfce7" opacity="0.12"/>
  <rect x="30" y="24" width="40" height="32" rx="12" fill="white" opacity="0.15"/>

  <!-- Olhos — LED minimalistas -->
  <rect x="35" y="34" width="10" height="6" rx="3" fill="#4ade80"/>
  <rect x="55" y="34" width="10" height="6" rx="3" fill="#4ade80"/>
  <!-- Brilho nos olhos -->
  <rect x="37" y="35" width="3" height="2" rx="1" fill="white" opacity="0.7"/>
  <rect x="57" y="35" width="3" height="2" rx="1" fill="white" opacity="0.7"/>

  <!-- Linha boca minimalista -->
  <path d="M38 46 Q50 52 62 46" fill="none" stroke="#4ade80" stroke-width="2" stroke-linecap="round"/>

  <!-- Antena centralizada -->
  <line x1="50" y1="22" x2="50" y2="14" stroke="#4ade80" stroke-width="2" stroke-linecap="round"/>
  <circle cx="50" cy="12" r="3" fill="#4ade80"/>

  <!-- Corpo com badge IA -->
  <rect x="33" y="60" width="34" height="24" rx="9" fill="white" opacity="0.12"/>
  <!-- Texto IA centralizado -->
  <text x="50" y="77" font-family="Arial" font-weight="800" font-size="13" fill="#4ade80" text-anchor="middle" letter-spacing="1">IA</text>

  <!-- Circuitos decorativos sutis -->
  <line x1="20" y1="42" x2="28" y2="42" stroke="#22c55e" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
  <circle cx="19" cy="42" r="2" fill="#22c55e" opacity="0.5"/>
  <line x1="72" y1="42" x2="80" y2="42" stroke="#22c55e" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
  <circle cx="81" cy="42" r="2" fill="#22c55e" opacity="0.5"/>
</svg>
