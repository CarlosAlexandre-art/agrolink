<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#104e27"/>
      <stop offset="100%" style="stop-color:#2d7a45"/>
    </linearGradient>
    <linearGradient id="face" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a6e3a"/>
      <stop offset="100%" style="stop-color:#104e27"/>
    </linearGradient>
  </defs>

  <!-- Antena -->
  <line x1="50" y1="8" x2="50" y2="18" stroke="#679d3f" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Bolinha antena -->
  <circle cx="50" cy="6" r="3.5" fill="#679d3f"/>
  <!-- Folhinha na antena -->
  <path d="M50 6 C44 2 42 8 46 9 C48 10 50 8 50 6 Z" fill="#8dc63f"/>

  <!-- Cabeça -->
  <rect x="26" y="18" width="48" height="38" rx="12" fill="url(#body)"/>

  <!-- Visor / tela da face -->
  <rect x="31" y="23" width="38" height="26" rx="8" fill="url(#face)"/>

  <!-- Olhos — brilhantes e expressivos -->
  <circle cx="41" cy="34" r="5.5" fill="#dad6ca"/>
  <circle cx="59" cy="34" r="5.5" fill="#dad6ca"/>
  <!-- Pupilas -->
  <circle cx="42" cy="34" r="3" fill="#104e27"/>
  <circle cx="60" cy="34" r="3" fill="#104e27"/>
  <!-- Brilho nos olhos -->
  <circle cx="43.5" cy="32.5" r="1.2" fill="white"/>
  <circle cx="61.5" cy="32.5" r="1.2" fill="white"/>

  <!-- Sorriso -->
  <path d="M42 42 Q50 48 58 42" fill="none" stroke="#679d3f" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Dentes / luz do sorriso -->
  <path d="M45 43.5 Q50 47 55 43.5" fill="rgba(103,157,63,0.3)" stroke="none"/>

  <!-- Bochechas (coradas) -->
  <ellipse cx="36" cy="40" rx="4" ry="2.5" fill="#8dc63f" opacity="0.35"/>
  <ellipse cx="64" cy="40" rx="4" ry="2.5" fill="#8dc63f" opacity="0.35"/>

  <!-- Corpo -->
  <rect x="30" y="57" width="40" height="28" rx="10" fill="url(#body)"/>

  <!-- Badge R$ no peito -->
  <rect x="38" y="63" width="24" height="14" rx="5" fill="#679d3f" opacity="0.5"/>
  <text x="50" y="73.5" font-family="Arial" font-weight="900" font-size="8" fill="white" text-anchor="middle">R$</text>

  <!-- Braços -->
  <rect x="14" y="58" width="14" height="8" rx="4" fill="url(#body)"/>
  <rect x="72" y="58" width="14" height="8" rx="4" fill="url(#body)"/>
  <!-- Mãozinhas -->
  <circle cx="14" cy="62" r="5" fill="#1a6e3a"/>
  <circle cx="86" cy="62" r="5" fill="#1a6e3a"/>

  <!-- Pernas -->
  <rect x="35" y="85" width="12" height="10" rx="4" fill="#0b3a1c"/>
  <rect x="53" y="85" width="12" height="10" rx="4" fill="#0b3a1c"/>

  <!-- Botas -->
  <rect x="33" y="92" width="16" height="6" rx="3" fill="#679d3f"/>
  <rect x="51" y="92" width="16" height="6" rx="3" fill="#679d3f"/>

  <!-- Folhinha decorativa no ombro -->
  <path d="M72 56 C78 50 82 54 78 58 C76 60 72 58 72 56 Z" fill="#679d3f" opacity="0.7"/>
</svg>
